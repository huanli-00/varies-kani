[package]
name = "varies-kani-verifier"
version = "0.65.0"
edition = "2024"
description = "A bit-precise model checker for Rust."
autobins = false
readme = "README.md"
keywords = ["model-checking", "verification"]
categories = ["development-tools"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/huanli-00/varies-kani"
documentation = "https://github.com/huanli-00/varies-kani#readme"
homepage = "https://github.com/huanli-00/varies-kani"
# N.B. Cargo.* is included automatically:
include = ["/src", "/tests/launcher_namespace.rs", "/build.rs", "/rust-toolchain.toml", "/LICENSE-*", "/README.md"]

[dependencies]
anyhow = "1"
home = "0.5"
os_info = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "varies-kani"
path = "src/bin/varies_kani.rs"

[[bin]]
name = "cargo-varies-kani"
path = "src/bin/cargo_varies_kani.rs"

[lib]
name = "kani_verifier"

[profile.release]
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = "off"

# Below is the workspace (vs above is "varies-kani-verifier" crate) config:

[workspace]
members = [
  "library/kani",
  "library/std",
  "tools/compiletest",
  "tools/build-kani",
  "tools/kani-cov",
  "kani-driver",
  "kani-compiler",
  "kani_metadata",
  "library/kani_core",
]

# This indicates what package to e.g. build with 'cargo build' without --workspace
default-members = [
  ".",
  "kani-driver",
  "kani-compiler",
]

exclude = [
  "build",
  "charon",
  "target",
  # dependency tests have their own workspace
  "tests/kani-dependency-test/dependency3",
  # cargo kani tests should also have their own workspace
  "tests/cargo-kani",
  "fixtures",
  "tests/cargo-ui",
  "tests/slow",
  "tests/std-checks",
  "tests/script-based-pre",
  "tests/script-based-pre/build-cache-bin/target/new_dep",
  "tests/script-based-pre/build-cache-dirty/target/new_dep",
  "tests/script-based-pre/verify_std_cmd/tmp_dir/target/kani_verify_std",
  "tests/script-based-pre/kani_lib_dep",
  "tests/script-based-pre/no_codegen",
  "tests/script-based-pre/no_codegen_error",
]

[workspace.lints.clippy]
too_long_first_doc_paragraph = "allow"
