name: Format
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: rustup show
      - run: cargo fmt -- --check
      - run: rustfmt --edition 2021 --config-path rustfmt.toml --check fixtures/synth-smoke/src/lib.rs
