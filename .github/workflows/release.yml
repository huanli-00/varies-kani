name: Release Bundle
on:
  push:
    tags: ['varies-kani-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          os: ubuntu-24.04
      - uses: ./.github/actions/build-bundle
        id: bundle
        with:
          platform: x86_64-unknown-linux-gnu
      - name: Install packaged launchers and bundle
        run: |
          cargo install --locked --path .
          cargo varies-kani setup --use-local-bundle ./${{ steps.bundle.outputs.bundle }}
      - name: Verify synthesized fixture
        working-directory: fixtures/synth-smoke
        run: |
          set -o pipefail
          cargo varies-kani --synth-pruning disabled | tee verification.log
          grep -F '2 successfully verified harnesses, 0 failures' verification.log
  publish:
    if: startsWith(github.ref, 'refs/tags/varies-kani-')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes
